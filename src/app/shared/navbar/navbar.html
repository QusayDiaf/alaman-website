<nav [class.scrolled]="isScrolled" class="fixed top-0 left-0 w-full z-50 transition-all duration-300 ease-in-out">
  <div class="mx-auto flex h-18 w-full items-center justify-between px-4 sm:px-6 md:px-12">
    
    <div class="flex items-center gap-3 z-50">
      <span class="flex-shrink-0">
        @if (showstarted) {
          <a routerLink="/" fragment="hero" (click)="closeMobileMenu()"> 
            <img src="assets/images/IMG_5640.png" class="rounded-xl h-14 w-14 md:h-20 md:w-20 object-contain transition-all" alt="logo">
          </a>
        }
        @else {
          <a routerLink="/" fragment="hero" (click)="closeMobileMenu()"> 
            <img src="assets/images/aaa.png" class="rounded-xl h-14 w-14 md:h-20 md:w-20 object-contain transition-all" alt="logo">
          </a>
        }
      </span>

      <a routerLink="/" fragment="hero" (click)="closeMobileMenu()" class="flex flex-col select-none gap-0.5"> 
        <span [class.text-black]="showstarted && !isMobileMenuOpen" [class.text-white]="!showstarted || isMobileMenuOpen"
              class="text-sm md:text-base font-bold leading-tight tracking-wide transition-colors duration-300">
         شركة الأمان الرقمي الجديد
        </span>
        <span [class.text-gray-500]="showstarted && !isMobileMenuOpen" [class.text-slate-400]="!showstarted || isMobileMenuOpen"
              class="text-[10px] md:text-xs transition-colors duration-300">
          لتقنية المعلومات والاتصالات
        </span>
      </a>
    </div>

    <button (click)="toggleMobileMenu()" class="flex flex-col justify-between w-7 h-5 bg-transparent border-none cursor-pointer p-0 z-50 md:hidden focus:outline-none" aria-label="قائمة التنقل">
      <span [class.rotate-45]="isMobileMenuOpen" [class.translate-y-2]="isMobileMenuOpen" 
            [class.bg-black]="showstarted && !isMobileMenuOpen" [class.bg-white]="!showstarted || isMobileMenuOpen" 
            class="w-full h-0.5 rounded-full transition-all duration-300 ease-in-out"></span>
      
      <span [class.opacity-0]="isMobileMenuOpen" 
            [class.bg-black]="showstarted && !isMobileMenuOpen" [class.bg-white]="!showstarted || isMobileMenuOpen" 
            class="w-full h-0.5 rounded-full transition-all duration-300 ease-in-out"></span>
      
      <span [class.-rotate-45]="isMobileMenuOpen" [class.-translate-y-1.5]="isMobileMenuOpen" 
            [class.bg-black]="showstarted && !isMobileMenuOpen" [class.bg-white]="!showstarted || isMobileMenuOpen" 
            class="w-full h-0.5 rounded-full transition-all duration-300 ease-in-out"></span>
    </button>

    <ul class="hidden md:flex items-center gap-6 lg:gap-8">
      <li><a routerLink="/" fragment="hero"      class="text-white/90 hover:text-cyan-400 text-sm font-medium transition-colors duration-200"><span class="text-gray-200">الرئيسية</span></a></li>
      <li><a routerLink="/" fragment="about"     class="text-white/90 hover:text-cyan-400 text-sm font-medium transition-colors duration-200"><span class="text-gray-200">من نحن</span></a></li>
      <li><a routerLink="/" fragment="services"  class="text-white/90 hover:text-cyan-400 text-sm font-medium transition-colors duration-200"><span class="text-gray-200">خدماتنا</span></a></li>
      <li><a routerLink="/" fragment="portfolio" class="text-white/90 hover:text-cyan-400 text-sm font-medium transition-colors duration-200"><span class="text-gray-200">أعمالنا</span></a></li>
      <li><a routerLink="/" fragment="technical" class="text-white/90 hover:text-cyan-400 text-sm font-medium transition-colors duration-200"><span class="text-gray-200">مبادئنا</span></a></li>
      <li><a routerLink="/" fragment="contact"   class="text-white/90 hover:text-cyan-400 text-sm font-medium transition-colors duration-200"><span class="text-gray-200">اتصل بنا</span></a></li>
    </ul>
    
    <div class="hidden md:block">
      <a routerLink="/" fragment="contact" class="shadow__btn nav-cta rounded-3xl px-6 py-2.5 inline-block text-sm font-bold">جدولة استشارة</a>
    </div>

    <div [class.translate-y-0]="isMobileMenuOpen" [class.opacity-100]="isMobileMenuOpen" [class.pointer-events-auto]="isMobileMenuOpen"
         class="fixed inset-0 w-full h-screen bg-[#0a1535]/98 backdrop-blur-lg flex flex-col items-center justify-center gap-8 transition-all duration-300 ease-in-out -translate-y-full opacity-0 pointer-events-none md:hidden z-40">
      
      <ul class="flex flex-col items-center gap-6 text-xl font-semibold w-full">
        <li><a routerLink="/" fragment="hero"      (click)="closeMobileMenu()" class="text-white hover:text-cyan-400 transition-colors"><span class="text-gray-200">الرئيسية</span></a></li>
        <li><a routerLink="/" fragment="about"     (click)="closeMobileMenu()" class="text-white hover:text-cyan-400 transition-colors"><span class="text-gray-200">من نحن</span></a></li>
        <li><a routerLink="/" fragment="services"  (click)="closeMobileMenu()" class="text-white hover:text-cyan-400 transition-colors"><span class="text-gray-200">خدماتنا</span></a></li>
        <li><a routerLink="/" fragment="portfolio" (click)="closeMobileMenu()" class="text-white hover:text-cyan-400 transition-colors"><span class="text-gray-200">أعمالنا</span></a></li>
        <li><a routerLink="/" fragment="technical" (click)="closeMobileMenu()" class="text-white hover:text-cyan-400 transition-colors"><span class="text-gray-200">مبادئنا</span></a></li>
        <li><a routerLink="/" fragment="contact"   (click)="closeMobileMenu()" class="text-white hover:text-cyan-400 transition-colors"><span class="text-gray-200">اتصل بنا</span></a></li>
      </ul>
      
      <button class="shadow__btn w-2/3 max-w-xs mt-4">
        <a routerLink="/" fragment="contact" (click)="closeMobileMenu()" class="nav-cta rounded-3xl py-3 w-full text-center inline-block font-bold no-underline text-white">جدولة استشارة</a>
      </button>
    </div>
   
  </div>
</nav>
