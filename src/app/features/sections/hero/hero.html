<section id="hero" class="hero-section">
  <div id="large-header" class="large-header">
     <canvas id="x-canvas"></canvas>
  </div>

  <div class="hero-bg">
    <div class="hero-gradient"></div>
    <div class="hero-grid"></div>
    <div class="float-circle fc1"></div>
    <div class="float-circle fc2"></div>
    <div class="float-circle fc3"></div>
    <div class="float-circle fc4"></div>
    <div class="float-circle fc5"></div>
    <div class="float-circle fc6"></div>
  </div>

  <div class="hero-content container">
    <div class="hero-text">
      <span class="hero-badge"><span class="badge-dot"></span>شركة الأمان الرقمي الجديد</span>
      <h1 class="hero-title">حماية ذكية لبيانات مؤسستك وخدماتك الرقمية</h1>
      <p class="hero-subtitle">نحن نقدم حلول أمنية متكاملة لتقنية المعلومات والاتصالات، مع خبرة عميقة في حماية الشبكات والبيانات.</p>
      
      <div class="hero-buttons">
        <a href="#contact" class="btn-primary">اطلب استشارة</a>
        <a href="#services" class="btn-secondary">استعرض خدماتنا</a>
      </div>

      <div class="hero-stats">
        <div class="hero-stat">
          <div class="hero-stat-num"><span>20</span>+</div>
          <div class="hero-stat-label">سنوات خبرة</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-num"><span>150</span>+</div>
          <div class="hero-stat-label">عميل سعيد</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-num"><span>99</span>%</div>
          <div class="hero-stat-label">نسبة رضا</div>
        </div>
      </div>
    </div>

    <div class="hero-visual">
      <div class="hero-3d-container">
        <svg class="hero-3d-svg" viewBox="0 0 600 600" aria-hidden="true">
          <defs>
            <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00D4FF" />
              <stop offset="100%" stop-color="#4A46A3" />
            </linearGradient>
          </defs>
          <circle cx="300" cy="300" r="120" fill="url(#heroGradient)" opacity="0.85" />
          <circle cx="380" cy="240" r="40" fill="rgba(255,255,255,0.35)" />
          <rect x="180" y="360" width="100" height="140" rx="24" fill="rgba(255,255,255,0.12)" />
          <rect x="240" y="220" width="160" height="60" rx="18" fill="rgba(255,255,255,0.15)" />
        </svg>
      </div>
    </div>
