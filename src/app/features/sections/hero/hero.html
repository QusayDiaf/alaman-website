<section id="hero" class="hero-section relative overflow-hidden flex items-center justify-center py-80  md:py-80   lg:py-0" dir="rtl">
  <div id="large-header" class="large-header absolute inset-0 w-full h-full z-1">
    <canvas id="x-canvas" class="absolute top-0 left-0 w-full h-full opacity-45 block"></canvas>
  </div>

  <div class="hero-bg absolute inset-0 overflow-hidden z-1">
    <div class="hero-gradient absolute inset-0"></div>
    <div class="hero-grid absolute inset-0 opacity-35"></div>
    <div class="float-circle fc1"></div>
    <div class="float-circle fc2"></div>
    <div class="float-circle fc3"></div>
    <div class="float-circle fc4"></div>
    <div class="float-circle fc5"></div>
    <div class="float-circle fc6"></div>
  </div>

  <div class="relative z-10 w-full max-w-6xl mx-auto px-4 sm:px-6 pt-20 lg:px-8 grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-8 items-center">

    <div class="text-white text-center lg:text-right flex flex-col items-center lg:items-start order-1">
      <div class="pt-2 md:pt-4">
        <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-sm font-bold bg-[#00D4FF]/08 border border-[#00D4FF]/28 text-[#00D4FF] mb-6">
        <span class="w-2 h-2 rounded-full bg-[#00D4FF] animate-ping"></span>
          شركة الأمان الرقمي الجديد
      </span>
      </div>
      
      <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-5xl font-black leading-snug sm:leading-relaxed mb-4 lg:mb-6 mt-2 lg:mt-4 max-w-xl">
        نبني حلولاً رقمية ذكية<br>
        لمستقبل أكثر <span class="text-blue-400">أماناً</span>
      </h1>

      <p class="text-white/75 text-base sm:text-lg leading-relaxed mb-8 lg:mb-10 px-4 sm:px-8 lg:px-0 lg:pl-12 max-w-lg lg:max-w-none">
        شريكك الاستراتيجي نحو التحول الرقمي بأصول هندسية وتقنية
      </p>

      <div class="flex flex-row gap-4 flex-wrap mb-8 justify-center lg:justify-start w-full sm:w-auto px-4 sm:px-0">
        <a href="#contact" class="btn-primary flex-1 sm:flex-none text-center">تواصل معنا</a>
        <a href="#services" class="btn-secondary flex-1 sm:flex-none text-center">عرض خدماتنا</a>
      </div>

      <div class="flex flex-col sm:flex-row gap-6 sm:gap-10 justify-center lg:justify-start items-center sm:items-start w-full">
        <div class="text-center lg:text-right border-b border-white/10 sm:border-b-0 pb-4 sm:pb-0 w-full sm:w-auto">
          <div class="hero-stat-num text-2xl sm:text-3xl lg:text-4xl font-black"><span>10</span>+</div>
          <div class="hero-stat-label text-xs sm:text-sm mt-1">سنوات خبرة</div>
        </div>
        <div class="text-center lg:text-right flex flex-col items-center lg:items-start w-full sm:w-auto">
          <div class="hero-stat-num text-2xl sm:text-3xl lg:text-4xl">
            <span><i class="fa-regular fa-user pr-0 md:pr-10 lg:pr-18"></i></span>
          </div>
          <div class="hero-stat-label text-xs sm:text-sm mt-1 max-w-[200px] sm:max-w-none">طاقم عمل ذو خبرة مهنية واسعة</div>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-center order-2 lg:order-2 w-full px-4 sm:px-12 md:px-20 lg:px-0 mt-6 lg:mt-0">
      <div class="hero-3d-container w-full max-w-[260px] sm:max-w-[340px] md:max-w-[380px] lg:max-w-[480px] aspect-square relative z-2">
        <svg class="hero-3d-svg w-full h-full" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#2F4DA0" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#4A46A3" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
            </radialGradient>
            <filter id="blur1">
              <feGaussianBlur stdDeviation="8"/>
            </filter>
          </defs>

          <ellipse cx="240" cy="240" rx="200" ry="200" fill="url(#glow1)" filter="url(#blur1)"/>
          <circle cx="240" cy="240" r="180" fill="none" stroke="rgba(47,77,160,0.2)" stroke-width="1" stroke-dasharray="8 12"/>
          <circle cx="240" cy="240" r="150" fill="none" stroke="rgba(0,212,255,0.15)" stroke-width="0.5"/>
          <circle cx="240" cy="240" r="120" fill="none" stroke="rgba(74,70,163,0.3)" stroke-width="1"/>

          <g transform="translate(240,240)" class="animate-shield">
            <path d="M0,-70 L55,-35 L55,15 Q55,60 0,80 Q-55,60 -55,15 L-55,-35 Z"
                  fill="rgba(47,77,160,0.3)" stroke="rgba(0,212,255,0.6)" stroke-width="1.5"/>
            <path d="M0,-55 L42,-28 L42,12 Q42,48 0,64 Q-42,48 -42,12 L-42,-28 Z"
                  fill="rgba(74,70,163,0.4)" stroke="rgba(123,158,248,0.4)" stroke-width="1"/>
            <rect x="-16" y="-8" width="32" height="26" rx="4" fill="rgba(0,212,255,0.8)" stroke="none"/>
            <path d="M-10,-8 L-10,-18 Q-10,-30 0,-30 Q10,-30 10,-18 L10,-8" fill="none" stroke="rgba(0,212,255,0.8)" stroke-width="3" stroke-linecap="round"/>
            <circle cx="0" cy="8" r="5" fill="rgba(26,43,94,0.9)"/>
            <rect x="-1.5" y="8" width="3" height="8" fill="rgba(26,43,94,0.9)"/>
          </g>

          <g id="orbit-ring">
            <g>
              <circle cx="240" cy="60" r="22" fill="rgba(47,77,160,0.5)" stroke="rgba(0,212,255,0.5)" stroke-width="1.5"/>
              <text x="240" y="65" text-anchor="middle" font-size="14" fill="#00D4FF" font-family="'Cairo',sans-serif">DB</text>
            </g>
            <g>
              <circle cx="420" cy="240" r="22" fill="rgba(74,70,163,0.5)" stroke="rgba(123,158,248,0.5)" stroke-width="1.5"/>
              <text x="420" y="245" text-anchor="middle" font-size="12" fill="#7B9EF8" font-family="'Sora',sans-serif">API</text>
            </g>
            <g>
              <circle cx="240" cy="420" r="22" fill="rgba(47,77,160,0.5)" stroke="rgba(0,212,255,0.5)" stroke-width="1.5"/>
              <text x="240" y="426" text-anchor="middle" font-size="11" fill="#00D4FF" font-family="'Sora',sans-serif">App</text>
            </g>
            <g>
              <circle cx="60" cy="240" r="22" fill="rgba(74,70,163,0.5)" stroke="rgba(123,158,248,0.5)" stroke-width="1.5"/>
              <text x="60" y="245" text-anchor="middle" font-size="11" fill="#7B9EF8" font-family="'Sora',sans-serif">UI</text>
            </g>
          </g>

          <line x1="240" y1="82" x2="240" y2="170" stroke="rgba(0,212,255,0.2)" stroke-width="1" stroke-dasharray="4 6"/>
          <line x1="398" y1="240" x2="295" y2="240" stroke="rgba(123,158,248,0.2)" stroke-width="1" stroke-dasharray="4 6"/>
          <line x1="240" y1="398" x2="240" y2="310" stroke="rgba(0,212,255,0.2)" stroke-width="1" stroke-dasharray="4 6"/>
          <line x1="82" y1="240" x2="185" y2="240" stroke="rgba(123,158,248,0.2)" stroke-width="1" stroke-dasharray="4 6"/>

          <circle cx="320" cy="100" r="4" fill="rgba(0,212,255,0.6)"/>
          <circle cx="380" cy="140" r="3" fill="rgba(123,158,248,0.5)"/>
          <circle cx="100" cy="340" r="4" fill="rgba(0,212,255,0.4)"/>
          <circle cx="140" cy="380" r="3" fill="rgba(123,158,248,0.4)"/>
          <circle cx="360" cy="360" r="5" fill="rgba(47,77,160,0.5)"/>
        </svg>
      </div>
    </div>

  </div>
</section>

  <svg 
    xmlns="http://www.w3.org/2000/svg" 
    viewBox="0 0 1440 80" 
    preserveAspectRatio="none" 
    class="w-full h-50 sm:h-40 md:h-50 lg:h-10 block pointer-events-none">
    <path d="M0,60 C240,0 480,80 720,40 C960,0 1200,80 1440,40 L1440,80 L0,80 Z" fill="#F5F6FA"/>
  </svg>
</div>
